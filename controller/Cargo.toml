[package]
name = "woz-world-dock"
version = "0.1.0"
edition = "2024"
description = "A small Windows controller for the local Woz's World OpenSimulator instance"
build = "build.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "=0.25.1"

[build-dependencies]
winres = "0.1.12"
